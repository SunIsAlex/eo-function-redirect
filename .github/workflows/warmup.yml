name: Refresh EO Token

on:
  schedule:
    - cron: '0 * * * *'  # 每小时
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh token via Edge Function
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            "https://go.sunisalex.org/refresh?secret=${{ secrets.REFRESH_SECRET }}")
          body=$(echo "$response" | head -n1)
          code=$(echo "$response" | tail -n1)
          echo "HTTP Status: $code"
          echo "Response: $body"
          if [ "$code" != "200" ]; then
            echo "❌ Refresh failed"
            exit 1
          fi
          echo "✅ Token refreshed successfully"
